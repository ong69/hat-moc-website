<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hạt Mộc | Private orders</title><style>body{font-family:Arial,sans-serif;background:#f4f4ef;color:#143b2b;margin:0}header{background:#103b2a;color:#f3d18b;padding:22px max(20px,5vw)}main{max-width:950px;margin:30px auto;padding:0 16px}h1{font-size:25px}input,button,select{font:inherit;padding:12px;border:1px solid #b7c7ba;border-radius:8px}button{background:#123e2c;color:white;cursor:pointer}button:disabled{opacity:.5}#login{display:flex;gap:8px;flex-wrap:wrap}#orders{display:grid;gap:14px}.order{background:white;border:1px solid #d9e1d9;border-radius:12px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{color:#596c60;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.error{color:#a22}#panel[hidden]{display:none}a{color:inherit}.items{margin:15px 0;background:#f5f7f3;padding:14px 16px;border-radius:8px}.items div{padding:7px 0;border-bottom:1px solid #e3e8e0}.items div:last-child{border:0}.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#e9f0e8;font-size:12px;font-weight:bold}.order .top b:last-child{font-size:20px}.subhead{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#617364;font-weight:700}.note{font-size:13px;color:#526a5b}#login[hidden]{display:none}</style></head><body><header><strong>Hạt Mộc</strong> · Private order management</header><main><h1>Orders</h1><p>Verify funds in St.George before marking any order paid. Customer payment screenshots are not proof of cleared funds.</p><div id="login"><input id="password" type="password" placeholder="Admin password" autocomplete="off"><button id="open">View orders</button></div><p id="message" role="status"></p><div id="panel" hidden><button id="refresh">Refresh orders</button><div id="orders"></div></div></main><script>
let password='';const productNames={coffee:'Hanoi Robusta coffee beans · 500g',cashew150:'Vietnamese roasted cashews · 150g',cashew300:'Vietnamese roasted cashews · 300g',cashew500:'Vietnamese roasted cashews · 500g',bundle:'Hanoi coffee & cashews bundle'};const deliveryNames={post:'Australia Post shipping',pickup:'Free Bankstown pickup',local:'Free local delivery'};const statusNames={awaiting_quote:'Awaiting final quote',awaiting_payment:'Awaiting payment',payment_claimed:'Customer reports payment',paid:'Payment verified',fulfilled:'Order fulfilled'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(method,body){const r=await fetch('/api/admin-orders',{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await call('GET');$('panel').hidden=false;$('login').hidden=true;$('message').className='';$('message').textContent=d.orders.length+' order(s) found';$('orders').innerHTML=d.orders.map(o=>'<article class="order"><div class="top"><div><div class="subhead">Order reference</div><b>'+esc(o.reference)+'</b></div><div><div class="subhead">Order total</div><b>'+esc(o.total)+'</b></div></div><p><strong>'+esc(o.customer_name)+'</strong><br><span class="meta">'+esc(o.customer_email)+'</span></p><p class="meta">'+esc(new Date(o.created_at).toLocaleString('en-AU'))+'</p><span class="status">'+esc(statusNames[o.status]||o.status)+'</span><div class="items"><div class="subhead">Products ordered</div>'+(o.items||[]).map(i=>'<div><strong>'+esc(productNames[i.id]||i.id)+'</strong> <span class="meta">× '+esc(i.qty)+'</span></div>').join('')+'</div><p><strong>Delivery:</strong> '+esc(deliveryNames[o.delivery_method]||o.delivery_method)+(o.destination?' · '+esc(o.destination):'')+'</p><p class="note">'+(o.confirmation_sent_at?'Payment confirmation emailed to customer.':o.payment_ready?'Check cleared funds in St.George before sending payment confirmation.':'Final quote required before payment confirmation.')+'</p><div class="actions"><select data-ref="'+esc(o.reference)+'"><option value="awaiting_quote">Awaiting quote</option><option value="awaiting_payment">Awaiting payment</option><option value="payment_claimed">Customer says paid</option><option value="paid">Payment verified</option><option value="fulfilled">Fulfilled</option></select><button data-save="'+esc(o.reference)+'">Save status</button><button data-send="'+esc(o.reference)+'" '+(o.confirmation_sent_at||!o.payment_ready?'disabled':'')+'>'+(o.confirmation_sent_at?'Confirmation already sent':'Confirm payment & email customer')+'</button></div></article>').join('');d.orders.forEach(o=>{const e=[...document.querySelectorAll('select[data-ref]')].find(x=>x.dataset.ref===o.reference);if(e)e.value=o.status})}catch(e){$('message').textContent=e.message;$('message').className='error'}}
$('open').onclick=()=>{password=$('password').value;$('password').value='';load()};$('refresh').onclick=load;
$('orders').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const ref=b.dataset.save||b.dataset.send;if(!ref)return;const sending=!!b.dataset.send;const status=sending?'paid':[...document.querySelectorAll('select[data-ref]')].find(x=>x.dataset.ref===ref).value;if(sending&&!confirm('Have you verified the cleared payment in St.George? This sends a confirmation to the customer.'))return;b.disabled=true;try{await call('POST',{reference:ref,status,sendConfirmation:sending});await load()}catch(err){$('message').textContent=err.message;$('message').className='error';b.disabled=false}};
</script></body></html>
