<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hạt Mộc | Private orders</title><style>body{font-family:Arial,sans-serif;background:#f4f4ef;color:#143b2b;margin:0}header{background:#103b2a;color:#f3d18b;padding:22px max(20px,5vw)}main{max-width:950px;margin:30px auto;padding:0 16px}h1{font-size:25px}input,button,select{font:inherit;padding:12px;border:1px solid #b7c7ba;border-radius:8px}button{background:#123e2c;color:white;cursor:pointer}button:disabled{opacity:.5}#login{display:flex;gap:8px;flex-wrap:wrap}#orders{display:grid;gap:14px}.order{background:white;border:1px solid #d9e1d9;border-radius:12px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{color:#596c60;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.error{color:#a22}#panel[hidden]{display:none}a{color:inherit}</style></head><body><header><strong>Hạt Mộc</strong> · Private order management</header><main><h1>Orders</h1><p>Verify funds in St.George before marking any order paid. Customer payment screenshots are not proof of cleared funds.</p><div id="login"><input id="password" type="password" placeholder="Admin password" autocomplete="off"><button id="open">View orders</button></div><p id="message" role="status"></p><div id="panel" hidden><button id="refresh">Refresh orders</button><div id="orders"></div></div></main><script>
let password='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(method,body){const r=await fetch('/api/admin-orders',{method,headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await call('GET');$('panel').hidden=false;$('message').textContent=d.orders.length+' order(s) found';$('orders').innerHTML=d.orders.map(o=>'<article class="order"><div class="top"><b>'+esc(o.reference)+'</b><b>'+esc(o.total)+'</b></div><p>'+esc(o.customer_name)+' · '+esc(o.customer_email)+'</p><p class="meta">'+esc(o.delivery_method)+' · '+esc(o.destination||'')+' · '+esc(new Date(o.created_at).toLocaleString('en-AU'))+'</p><p>'+esc((o.items||[]).map(i=>i.id+' × '+i.qty).join(', '))+'</p><div class="actions"><select data-ref="'+esc(o.reference)+'"><option value="awaiting_quote">Awaiting quote</option><option value="awaiting_payment">Awaiting payment</option><option value="payment_claimed">Customer says paid</option><option value="paid">Payment verified</option><option value="fulfilled">Fulfilled</option></select><button data-save="'+esc(o.reference)+'">Save status</button><button data-send="'+esc(o.reference)+'" '+(o.confirmation_sent_at||!o.payment_ready?'disabled':'')+'> '+(o.confirmation_sent_at?'Confirmation sent':'Confirm payment & email customer')+'</button></div></article>').join('');d.orders.forEach(o=>{const e=[...document.querySelectorAll('select[data-ref]')].find(x=>x.dataset.ref===o.reference);if(e)e.value=o.status})}catch(e){$('message').textContent=e.message;$('message').className='error'}}
$('open').onclick=()=>{password=$('password').value;$('password').value='';load()};$('refresh').onclick=load;
$('orders').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const ref=b.dataset.save||b.dataset.send;if(!ref)return;const sending=!!b.dataset.send;const status=sending?'paid':[...document.querySelectorAll('select[data-ref]')].find(x=>x.dataset.ref===ref).value;if(sending&&!confirm('Have you verified the cleared payment in St.George? This sends a confirmation to the customer.'))return;b.disabled=true;try{await call('POST',{reference:ref,status,sendConfirmation:sending});await load()}catch(err){$('message').textContent=err.message;$('message').className='error';b.disabled=false}};
</script></body></html>
